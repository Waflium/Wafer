[workspace]
resolver = "3"
members = ["crates/wafer-core", "crates/wafer-data", "crates/wafer-probe", "crates/wafer-protocol", "crates/wafer-server", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
wafer-core = { path = "crates/wafer-core" }
wafer-data = { path = "crates/wafer-data" }
wafer-protocol = { path = "crates/wafer-protocol" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "signal", "sync", "time"] }
serde_json = "1"
anyhow = "1"
